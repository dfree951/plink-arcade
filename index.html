<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Drop a weapon token, fight the monster below, and gear up for the next descent in Plink Arcade.">
  <meta name="theme-color" content="#151418">
  <title>Plink Arcade · The Underkeep</title>
  <link rel="stylesheet" href="./assets/arcade.css?v=underkeep">
  <script type="module" src="./assets/arcade.js?v=underkeep"></script>
</head>
<body>
  <header class="topbar">
    <div class="frame masthead">
      <a class="brand" href="./" aria-label="Plink Arcade"><span class="brand-mark" aria-hidden="true">✦</span>PLINK</a>
      <nav class="editions" aria-label="Game version"><a href="./" aria-current="page">Arcade</a><a href="./classic/">Classic</a></nav>
      <div class="header-tools">
        <button type="button" class="quiet" id="help">How to play</button>
        <button type="button" class="quiet sound" id="sound" aria-pressed="true"><span class="sound-icon" aria-hidden="true"></span><span id="sound-label">Sound on</span></button>
      </div>
    </div>
  </header>

  <main class="frame game">
    <div class="game-heading">
      <h1>The Underkeep</h1>
      <div class="heading-actions">
        <button type="button" class="quiet" id="journal">Bestiary</button>
        <button type="button" class="quiet" id="armory">Armory</button>
        <button type="button" class="quiet forge" id="forge">Forge</button>
      </div>
    </div>

    <div class="game-layout">
      <section class="machine" id="machine" aria-label="Expedition board">
        <div class="machine-head">
          <div class="depth-select"><label for="depth">Depth</label><select id="depth" disabled></select></div>
          <div class="machine-status"><span class="status-light" aria-hidden="true"></span><span id="machine-state">Loading</span></div>
          <button class="quiet view" type="button" id="view" aria-pressed="false" disabled>Angled view</button>
        </div>

        <div class="stage" id="stage" role="region" aria-label="3D pegboard and monster gates">
          <div class="stage-loading" id="stage-loading">Lighting the board…</div>
          <div class="battle-hud" id="battle-hud" hidden>
            <div class="fighter"><strong>You</strong><span id="arena-hero-hp"></span><div class="hp-track"><div id="arena-hero-meter"></div></div></div>
            <div class="fighter foe"><strong id="arena-foe-name"></strong><span id="arena-foe-hp"></span><div class="hp-track"><div id="arena-foe-meter"></div></div></div>
            <span class="floating-hit player-hit" id="player-hit" aria-hidden="true"></span>
            <span class="floating-hit enemy-hit" id="enemy-hit" aria-hidden="true"></span>
            <div class="battle-signal" id="battle-signal"></div>
          </div>
        </div>

        <div class="launch-controls" id="aim-controls">
          <div class="position-picker">
            <label for="lane">Start</label>
            <button type="button" class="step" id="lane-left" aria-label="Previous start position" disabled>−</button>
            <output id="lane-value" for="lane">10</output>
            <button type="button" class="step" id="lane-right" aria-label="Next start position" disabled>+</button>
            <input type="range" id="lane" min="1" max="20" value="10" disabled>
          </div>
          <div class="launch-kit" id="launch-kit" hidden>
            <label for="rack-count">Tokens</label><select id="rack-count"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select>
            <label for="rack-spread" class="screen-reader">Token spacing</label><select id="rack-spread"><option value="1">Tight spread</option><option value="3">Wide spread</option></select>
          </div>
          <button type="button" class="primary drop" id="drop" disabled><span id="drop-label">Drop token</span><span aria-hidden="true">↓</span></button>
        </div>

        <div class="battle-controls" id="battle-controls" hidden>
          <fieldset class="stances" aria-label="Combat stance">
            <label><input type="radio" name="stance" value="strike" checked><b>Strike</b><small>More damage</small></label>
            <label><input type="radio" name="stance" value="focus"><b>Focus</b><small>Better accuracy</small></label>
            <label><input type="radio" name="stance" value="guard"><b>Guard</b><small>Reduce damage</small></label>
          </fieldset>
          <div class="fight-tools"><button type="button" class="quiet" id="tonic">Tonic</button><button type="button" class="quiet" id="retreat">Retreat</button></div>
        </div>

        <div class="resolution" id="resolution" hidden><div><strong id="result-title"></strong><p id="result-detail"></p></div><button class="primary" id="continue" type="button">Back to board</button></div>
        <p class="machine-note" id="machine-note" role="status">Drag the token along the top rail to aim.</p>
      </section>

      <aside class="side" aria-label="Expedition details">
        <section class="character">
          <div class="side-heading"><h2>Expedition</h2><button class="text-button" type="button" id="camp">Rest at camp</button></div>
          <div class="vitality"><span>Vitality</span><b id="hp-label">26 / 26</b><div class="hp-track"><div id="hp-meter"></div></div></div>
          <dl class="stats"><div><dt>Gold</dt><dd id="gold">12</dd></div><div><dt>Victories</dt><dd id="wins">0</dd></div><div><dt>Tonics</dt><dd id="tonics">2</dd></div></dl>
        </section>

        <section class="equipment">
          <h2>Equipped</h2>
          <div class="weapon-wrap"><span class="weapon-icon" id="weapon-icon" aria-hidden="true"></span><div><strong id="weapon-name">Iron Longsword</strong><p id="weapon-detail">Slash · Level 1</p></div></div>
          <div class="mastery"><div id="xp-meter"></div></div><p id="weapon-xp" class="muted small"></p>
          <div class="armor-line"><span>Armor</span><b id="armor-name">Travel Coat</b></div>
        </section>

        <section class="scout">
          <div class="side-heading"><h2 id="scout-title">Below lane 10</h2><span id="scout-danger" class="danger"></span></div>
          <div class="monster-wrap"><span class="monster-icon" id="scout-icon" aria-hidden="true"></span><div><strong id="scout-name">Soot Rat</strong><p id="scout-weak"></p></div></div>
          <p class="depth-task" id="depth-task"></p>
          <p class="forge-readout" id="forge-readout" hidden></p>
          <ol id="combat-log" class="combat-log" aria-label="Combat log" hidden></ol>
        </section>
      </aside>
    </div>
  </main>

  <dialog id="options" aria-labelledby="options-title">
    <div class="dialog-head"><h2 id="options-title"></h2><button type="button" class="close" id="close-options" aria-label="Close">×</button></div>
    <div class="dialog-body" id="option-content"></div>
  </dialog>
  <noscript><p class="frame">Enable JavaScript to play Plink.</p></noscript>
</body>
</html>
